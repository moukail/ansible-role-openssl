---
- name: Check installed OpenSSL versions
  ansible.builtin.include_tasks: check.yaml

- name: Install OpenSSL when required
  when: openssl_install_required | bool
  block:

    - name: Try package manager installation
      ansible.builtin.include_tasks: install_package.yaml

    - name: Verify package installation
      ansible.builtin.command:
        cmd: openssl version
      register: openssl_package_result
      changed_when: false
      failed_when: >-
        openssl_package_result.rc != 0 or
        openssl_package_result.stdout.split()[1]
        is version(openssl_version, '<', version_type='loose')

  rescue:

    - name: Compile OpenSSL from source
      ansible.builtin.include_tasks: compile.yaml

- name: Verify final OpenSSL installation
  ansible.builtin.include_tasks: verify.yaml